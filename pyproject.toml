[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geont"
version = "0.1.0"
description = "GeoNT model and streaming runtime research code"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
inference = "geont_runtime.inference:console_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
