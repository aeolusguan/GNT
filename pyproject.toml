[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gent"
version = "0.1.0"
description = "GeNT model and streaming runtime research code"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
inference = "gent.runtime.inference:console_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
