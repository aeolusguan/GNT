streams:
  instance: gent.runtime.streams.frame_dir_stream.FrameDirStreamList
  base_path: ???
  frame_start: 0
  frame_end: -1
  frame_skip: 1
  cached: false

pipeline:
  instance: gent.runtime.pipeline.default.DefaultAnnotationPipeline
  init: {}
  post: {}
  output:
    path: outputs
  slam:
    ckpt_path: ???
    intrinsics: ???  # [F, 4] per selected frame, or [4] for a fixed camera
    depth_normalization_min_cutoff: 80.0  # Always retain non-sky depths below this value
    depth_normalization_quantile: 0.8  # Raise the cutoff to this non-sky depth quantile
    visualize: false
    buffer: 512
    pgo_iters: 12
    pgo_damping: 1.0e-3
    pgo_lm_max_attempts: 5
    pgo_huber_delta: 1.0
    pgo_mode: se3_scale
    pgo_backend: cuda_eigen
    pgo_moge_mode_nis: true
    pgo_moge_mode_count: 8
    pgo_moge_mode_nis_cutoff: 0.01
    local_edge_outlier_trans_conf_thresh: 0.1
    local_edge_max_rotation_deg: 30.0
    local_edge_max_translation: 5.0
    keyframe_motion_thresh: 20.0
    local_mapping_window: 25
    local_mapping_radius: 2
    local_mapping_nms: 1
    local_mapping_thresh: 16.0
    local_pgo_every: 10
    use_fp16: true
