tartanair_root: datasets/TartanAir
split: gent/data/tartan_test.txt
ckpt: ???
output: outputs/tartanair_pgo_eval

scenes: []
max_scenes: 0
frame_start: 0
frame_end: 80
frame_skip: 1
intrinsics: [320.0, 320.0, 320.0, 240.0]

slam:
  buffer: 1024
  pgo_iters: 12
  pgo_damping: 1.0e-3
  pgo_lm_max_attempts: 5
  pgo_huber_delta: 0.05
  pgo_mode: se3_scale
  pgo_backend: cuda_eigen
  pgo_moge_mode_nis: true
  pgo_moge_mode_count: 8
  pgo_moge_mode_nis_cutoff: 0.01
  local_edge_outlier_trans_conf_thresh: 0.1
  local_edge_max_rotation_deg: 30.0
  local_edge_max_translation: 5.0
  keyframe_motion_thresh: 20.0
  local_mapping_window: 25
  local_mapping_radius: 2
  local_mapping_nms: 1
  local_mapping_thresh: 16.0
  local_pgo_every: 10
  use_fp16: true
